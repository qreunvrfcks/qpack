version: 2

project_name: qpack

builds:
  - id: qpack
    main: ./cmd
    goos: [linux, windows]
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    ids: [qpack]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - assets/icon.png
      - assets/qpack.desktop
      - assets/install.sh
checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  header: |
    Parallel pack/unpack: per-file worker pool sized to NumCPU, byte-identical output.
