# GoReleaser configuration for qpack.
# Release: git tag vX.Y.Z && git push origin vX.Y.Z
# GitHub Action builds archives for linux/windows/darwin (amd64+arm64).

version: 2

project_name: qpack

builds:
  - id: qpack
    main: ./cmd
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - readme.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
